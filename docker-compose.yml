---
services:
  traefik:
    image: traefik:v3.7
    container_name: traefik
    command:
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
      - "--certificatesresolvers.myresolver.acme.dnschallenge=true"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.myresolver.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.myresolver.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
      - "--api.dashboard=true"
      - "--ping=true"
      - "--accesslog=true"
      - "--accesslog.filepath=/logs/access.log"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--providers.file.filename=/etc/traefik/dynamic.yml"
    environment:
      - CF_DNS_API_TOKEN=${CF_DNS_API_TOKEN}
    # Port 80 stays inside Docker. Port 443 is LAN-bound for qBittorrent/local Plex.
    ports:
      - "${LAN_IP:-127.0.0.1}:443:443"
    volumes:
      - /opt/docker/traefik/letsencrypt:/letsencrypt
      - /opt/docker/traefik/logs:/logs
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    networks:
      edge_network:
        ipv4_address: 172.30.0.3
      downloads_network:
      prowlarr_network:
      bazarr_network:
      plex_network:
      tautulli_network:
      beszel_network:
      wireguard_network:
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "1"}

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      edge_network:
        ipv4_address: 172.30.0.2
    depends_on:
      traefik:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}

  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add: [NET_ADMIN]
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${VPN_USER}
      - OPENVPN_PASSWORD=${VPN_PASSWORD}
      - SERVER_REGIONS=${VPN_REGION}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - TZ=${TZ}
      - FIREWALL_INPUT_PORTS=8080
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
      - VPN_PORT_FORWARDING_DOWN_COMMAND=/bin/sh -c 'wget -O- -nv --retry-connrefused --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
    volumes:
      - /opt/docker/gluetun:/gluetun
    networks: [downloads_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9999 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 6
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "1"}

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
      - WEBUI_PORT=8080
      - QBITTORRENT_SERVER_DOMAIN=qbittorrent.${DOMAIN}
    volumes:
      - /opt/docker/qbittorrent:/config
      - ${ROOT_MEDIA_DIR}:/data
      - ./scripts/qbittorrent-init.sh:/custom-cont-init.d/10-qbittorrent-security:ro
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/app/version >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 1G, cpus: "2"}

  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
      - ADVERTISE_IP=https://${SERVER_IP}:32400
    volumes:
      - /opt/docker/plex:/config
      - ${ROOT_MEDIA_DIR}:/data:ro
      - ${ROOT_MEDIA_DIR}/transcode:/transcode
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    ports:
      - "32400:32400"
    networks: [plex_network, plex_monitoring_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:32400/identity >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: {memory: 6G, cpus: "4"}

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    container_name: tautulli
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes:
      - /opt/docker/tautulli:/config
    networks: [tautulli_network, plex_monitoring_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8181/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}

  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    environment:
      - APP_URL=https://beszel.${DOMAIN}
    volumes:
      - /opt/docker/beszel/data:/beszel_data
      - /opt/docker/beszel/socket:/beszel_socket
    # LAN-only access for initial setup and local fallback.
    ports:
      - "${LAN_IP:-127.0.0.1}:8090:8090"
    networks: [beszel_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "1"}

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    environment:
      - LISTEN=/beszel_socket/beszel.sock
      - KEY=${BESZEL_AGENT_KEY:-}
      - TOKEN=${BESZEL_AGENT_TOKEN:-}
    volumes:
      - /opt/docker/beszel/agent:/var/lib/beszel-agent
      - /opt/docker/beszel/socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15
    container_name: wg-easy
    environment:
      - TZ=${TZ}
    volumes:
      # Active v15 database and generated WireGuard configuration.
      - /opt/docker/wg-easy-v15:/etc/wireguard
    ports:
      - "51820:51820/udp"
    cap_add: [NET_ADMIN]
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks: [wireguard_network]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 128M, cpus: "0.5"}

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes: [/opt/docker/prowlarr:/config]
    networks: [prowlarr_network, indexer_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1"}

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes:
      - /opt/docker/sonarr:/config
      - ${ROOT_MEDIA_DIR}:/data
    networks: [downloads_network, indexer_network, subtitles_network, plex_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1"}

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes:
      - /opt/docker/radarr:/config
      - ${ROOT_MEDIA_DIR}:/data
    networks: [downloads_network, indexer_network, subtitles_network, plex_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1"}

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes:
      - /opt/docker/lidarr:/config
      - ${ROOT_MEDIA_DIR}:/data
    networks: [downloads_network, indexer_network, plex_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1"}

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - UMASK=077
    volumes:
      - /opt/docker/bazarr:/config
      - ${ROOT_MEDIA_DIR}:/data
    networks: [bazarr_network, subtitles_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1"}

  minecraft-survival:
    image: itzg/minecraft-server:latest
    container_name: minecraft-survival
    stdin_open: true
    tty: true
    environment:
      - EULA=TRUE
      - TYPE=VANILLA
      - VERSION=26.3
      - MEMORY=2G
      - TZ=${TZ}
    volumes: [/opt/docker/minecraft-survival:/data]
    ports:
      - "${LAN_IP:-127.0.0.1}:25565:25565"
    networks: [minecraft_survival_network]
    restart: unless-stopped
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits: {memory: 3G, cpus: "2"}

  minecraft-creative:
    image: itzg/minecraft-server:latest
    container_name: minecraft-creative
    stdin_open: true
    tty: true
    environment:
      - EULA=TRUE
      - TYPE=VANILLA
      - VERSION=26.3
      - MEMORY=2G
      - TZ=${TZ}
    volumes: [/opt/docker/minecraft-creative:/data]
    ports:
      - "${LAN_IP:-127.0.0.1}:25566:25565"
    networks: [minecraft_creative_network]
    restart: unless-stopped
    healthcheck:
      test: mc-health
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits: {memory: 3G, cpus: "2"}

configs:
  traefik_dynamic:
    content: |
      http:
        routers:
          api:
            rule: "Host(`traefik.${DOMAIN}`)"
            entryPoints: [web]
            service: api@internal
            middlewares: [tunnel-chain]
          tautulli:
            rule: "Host(`tautulli.${DOMAIN}`)"
            entryPoints: [web]
            service: tautulli
            middlewares: [tunnel-chain]
          beszel:
            rule: "Host(`beszel.${DOMAIN}`)"
            entryPoints: [web]
            service: beszel
            middlewares: [tunnel-chain]
          wireguard:
            rule: "Host(`wireguard.${DOMAIN}`)"
            entryPoints: [web]
            service: wireguard
            middlewares: [tunnel-chain]
          prowlarr:
            rule: "Host(`prowlarr.${DOMAIN}`)"
            entryPoints: [web]
            service: prowlarr
            middlewares: [tunnel-chain]
          sonarr:
            rule: "Host(`sonarr.${DOMAIN}`)"
            entryPoints: [web]
            service: sonarr
            middlewares: [tunnel-chain]
          radarr:
            rule: "Host(`radarr.${DOMAIN}`)"
            entryPoints: [web]
            service: radarr
            middlewares: [tunnel-chain]
          lidarr:
            rule: "Host(`lidarr.${DOMAIN}`)"
            entryPoints: [web]
            service: lidarr
            middlewares: [tunnel-chain]
          bazarr:
            rule: "Host(`bazarr.${DOMAIN}`)"
            entryPoints: [web]
            service: bazarr
            middlewares: [tunnel-chain]
          qbittorrent:
            rule: "Host(`qbittorrent.${DOMAIN}`)"
            entryPoints: [websecure]
            service: qbittorrent
            middlewares: [security-headers, local-access]
            tls: {certResolver: myresolver}
          plex:
            rule: "Host(`plex.${DOMAIN}`)"
            entryPoints: [websecure]
            service: plex
            middlewares: [security-headers]
            tls: {certResolver: myresolver}
        middlewares:
          tunnel-chain:
            chain:
              middlewares: [security-headers, tunnel-only]
          tunnel-only:
            ipAllowList:
              sourceRange: ["172.30.0.2/32"]
          local-access:
            ipAllowList:
              sourceRange: ["${LOCAL_SUBNET}"]
          security-headers:
            headers:
              customFrameOptionsValue: SAMEORIGIN
              contentTypeNosniff: true
              stsIncludeSubdomains: true
              stsPreload: true
              stsSeconds: 31536000
              referrerPolicy: strict-origin-when-cross-origin
              customResponseHeaders:
                Permissions-Policy: "camera=(), microphone=(), payment=()"
        services:
          tautulli: {loadBalancer: {servers: [{url: "http://tautulli:8181"}]}}
          beszel: {loadBalancer: {servers: [{url: "http://beszel:8090"}]}}
          wireguard: {loadBalancer: {servers: [{url: "http://wg-easy:51821"}]}}
          prowlarr: {loadBalancer: {servers: [{url: "http://prowlarr:9696"}]}}
          sonarr: {loadBalancer: {servers: [{url: "http://sonarr:8989"}]}}
          radarr: {loadBalancer: {servers: [{url: "http://radarr:7878"}]}}
          lidarr: {loadBalancer: {servers: [{url: "http://lidarr:8686"}]}}
          bazarr: {loadBalancer: {servers: [{url: "http://bazarr:6767"}]}}
          qbittorrent: {loadBalancer: {servers: [{url: "http://gluetun:8080"}]}}
          plex: {loadBalancer: {servers: [{url: "http://plex:32400"}]}}

networks:
  edge_network:
    driver: bridge
    ipam:
      config: [{subnet: 172.30.0.0/24}]
  downloads_network: {driver: bridge}
  prowlarr_network: {driver: bridge}
  indexer_network: {driver: bridge, internal: true}
  bazarr_network: {driver: bridge}
  subtitles_network: {driver: bridge, internal: true}
  plex_network: {driver: bridge}
  tautulli_network: {driver: bridge}
  beszel_network: {driver: bridge}
  plex_monitoring_network: {driver: bridge, internal: true}
  wireguard_network: {driver: bridge}
  minecraft_survival_network: {driver: bridge}
  minecraft_creative_network: {driver: bridge}
